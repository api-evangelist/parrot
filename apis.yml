aid: parrot
name: Parrot
description: >-
  Parrot is an AI-powered legal technology platform purpose-built for the
  litigation, court reporting, and insurance community. Its proprietary large
  language models are trained on legal and insurance terminology to deliver
  audio/video-synced deposition transcripts, AI-generated deposition summaries
  (narrative, page:line, or topic-based), remote deposition scheduling and
  livestreaming, and AI-enabled medical record summaries with chronologies and
  source linking. Trusted by law firms, insurance carriers such as USAA and
  Travelers, and Fortune 500 corporations, Parrot operates under SOC 2, HIPAA,
  and HITECH controls. Backed by Amplify Partners and XYZ Venture Capital
  ($11M Series A, 2023); Parrot is now part of Filevine. Parrot is a product
  and services company; it does not publish a public developer API, SDK, or
  developer portal.
